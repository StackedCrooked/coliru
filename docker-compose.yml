services:
  webserver:
    build:
      context: .
      dockerfile: Docker/webserver/Dockerfile
    image: coliru-webserver:latest
    ports:
      - "8080:8080"
    environment:
      COLIRU_URL: "0.0.0.0"
      COLIRU_PORT: "8080"
      COLIRU_RUNNER_IMAGE: "coliru-runner:latest"
      COLIRU_JOB_ROOT: "/job"
      COLIRU_RUNNER_VOLUME: "coliru_jobs"
      COLIRU_RUNNER_USER: "2001"
      COLIRU_RUNNER_MAX_FILESIZE: "524288" # KB
      COLIRU_RUNNER_CPU: "10" # CPU time limit in seconds
      COLIRU_RUNNER_MAX_OUTPUT: "524288" # 512KB output cap in bytes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${COLIRU_ARCHIVE_ROOT:-.}/Archive:/Archive:ro
      - ${COLIRU_ARCHIVE_ROOT:-.}/Archive2:/Archive2:rw
      - ${COLIRU_ARCHIVE_ROOT:-.}/Archive2:/opt/coliru/Archive2:rw
      - ${COLIRU_STATE_ROOT:-./Web}/feedback.txt:/opt/coliru/Web/feedback.txt:rw
      - coliru_jobs:/job:rw
    group_add:
      - "${DOCKER_GID}"
volumes:
  coliru_jobs:
    name: coliru_jobs
