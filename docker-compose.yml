services:
  webserver:
    build:
      context: .
      dockerfile: Docker/webserver/Dockerfile
    image: coliru-webserver:latest
    ports:
      - "8080:8080"
    environment:
      COLIRU_URL: "0.0.0.0"
      COLIRU_PORT: "8080"
      COLIRU_RUNNER_IMAGE: "coliru-runner:latest"
      COLIRU_JOB_ROOT: "/job"
      COLIRU_RUNNER_VOLUME: "coliru_jobs"
      COLIRU_RUNNER_FSIZE: "1048576" # 512MB (ulimit fsize uses 512-byte blocks)
      COLIRU_RUNNER_MAX_OUTPUT: "524288" # 512KB output cap in bytes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./Archive:/Archive:ro
      - ./Archive2:/Archive2:rw
      - ./Archive2:/opt/coliru/Archive2:rw
      - coliru_jobs:/job:rw
    group_add:
      - "${DOCKER_GID}"
volumes:
  coliru_jobs:
    name: coliru_jobs
